name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version
        shell: bash
        run: |
          project_version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          package = next(
              package for package in metadata["packages"]
              if package["name"] == "component-playground-desktop"
          )
          print(package["version"])
          ')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "Cargo version ($project_version) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            target: aarch64-apple-darwin
            architecture: arm64
          - name: macOS Intel
            target: x86_64-apple-darwin
            architecture: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p component-playground-desktop

      - name: Package release archive
        shell: bash
        run: |
          archive="component-playground-${GITHUB_REF_NAME}-${{ matrix.architecture }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" \
            -C "target/${{ matrix.target }}/release" \
            component-playground-desktop
          shasum -a 256 "dist/$archive" > "dist/$archive.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Component Playground ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
