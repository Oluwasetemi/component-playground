name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version
        shell: bash
        run: |
          project_version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          package = next(
              package for package in metadata["packages"]
              if package["name"] == "component-playground-desktop"
          )
          print(package["version"])
          ')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "Cargo version ($project_version) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            binary: component-playground-desktop
            archive: component-playground-${{ github.ref_name }}-macos-arm64.tar.gz
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            binary: component-playground-desktop
            archive: component-playground-${{ github.ref_name }}-macos-x86_64.tar.gz
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: component-playground-desktop
            archive: component-playground-${{ github.ref_name }}-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: component-playground-desktop.exe
            archive: component-playground-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p component-playground-desktop

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/package/component-playground-${GITHUB_REF_NAME}"
          mkdir -p "$package_dir"
          cp README.md CHANGELOG.md crates/desktop/assets/app-icon.png "$package_dir/"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            app_dir="$package_dir/Component Playground.app"
            mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$app_dir/Contents/MacOS/Component Playground"
            chmod +x "$app_dir/Contents/MacOS/Component Playground"

            iconset="$RUNNER_TEMP/AppIcon.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" crates/desktop/assets/app-icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
              double=$((size * 2))
              sips -z "$double" "$double" crates/desktop/assets/app-icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "$app_dir/Contents/Resources/AppIcon.icns"

            cat > "$app_dir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Component Playground</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.component-playground.app</string>
            <key>CFBundleName</key>
            <string>Component Playground</string>
            <key>CFBundleDisplayName</key>
            <string>Component Playground</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/"

            if [[ "${{ runner.os }}" == "Linux" ]]; then
              mkdir -p "$package_dir/share/applications" "$package_dir/share/icons/hicolor/1024x1024/apps"
              cp crates/desktop/assets/app-icon.png "$package_dir/share/icons/hicolor/1024x1024/apps/com.component-playground.app.png"
              cat > "$package_dir/share/applications/com.component-playground.app.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Component Playground
          Exec=component-playground-desktop
          Icon=com.component-playground.app
          Categories=Development;
          DESKTOP
            fi
          fi

      - name: Package Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C dist/package "component-playground-${GITHUB_REF_NAME}"
          hash="$(shasum -a 256 "dist/${{ matrix.archive }}" | awk '{print $1}')"
          echo "$hash  ${{ matrix.archive }}" > "dist/${{ matrix.archive }}.sha256"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="${{ matrix.archive }}"
          dmg="${dmg%.tar.gz}.dmg"
          hdiutil create \
            -volname "Component Playground" \
            -srcfolder "dist/package/component-playground-${GITHUB_REF_NAME}" \
            -ov \
            -format UDZO \
            "dist/$dmg"
          hash="$(shasum -a 256 "dist/$dmg" | awk '{print $1}')"
          echo "$hash  $dmg" > "dist/$dmg.sha256"

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/package/component-playground-${env:GITHUB_REF_NAME}" -DestinationPath "dist/${{ matrix.archive }}"
          $hash = Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${{ matrix.archive }}" | Out-File -Encoding ascii "dist/${{ matrix.archive }}.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.dmg *.zip > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Component Playground ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
