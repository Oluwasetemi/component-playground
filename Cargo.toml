[workspace]
resolver = "2"
members = ["crates/ui", "crates/desktop"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders"
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "04cc6eb25aa66bafa718bebea71dc5a933d26288" }
# Optional, for default bundled assets
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "04cc6eb25aa66bafa718bebea71dc5a933d26288" }
anyhow = "1.0"
component-playground-ui = { path = "crates/ui" }
