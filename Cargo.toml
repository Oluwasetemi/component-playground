[workspace]
resolver = "2"
members = ["crates/ui", "crates/desktop"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gpui = { package = "gpui-kit", git = "https://github.com/longbridge/gpui-kit", features = [
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-kit" }
# Optional, for default bundled assets
gpui-component-assets = { package = "gpui-kit-assets", git = "https://github.com/longbridge/gpui-kit" }
anyhow = "1.0"
embed-resource = "3.0"
image = "0.25"
component-playground-ui = { path = "crates/ui" }
